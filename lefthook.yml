# Git hooks managed by lefthook (https://github.com/evilmartians/lefthook).
# Install after cloning: pnpm exec lefthook install
# Run this same gate manually with: pnpm run check:pre-push
# CI should run `pnpm run check:pre-push` independently; local hooks can be skipped.

pre-push:
  jobs:
    - name: hackathon log updated within 30 min
      run: pnpm run check:hackathon-log
    - name: hackathon log entries carry titles, beads, commits, and file lists
      run: pnpm run check:hackathon-format
    - name: no monospace fonts (brand rule)
      run: pnpm run check:brand:no-mono
    - name: no tracking-* utilities (brand rule)
      run: pnpm run check:brand:no-tracking
    - name: machine contracts and documentation
      run: pnpm run check:machine-docs
    - name: project documentation is current
      run: pnpm run check:project-docs
    - name: library and domain naming conventions
      run: pnpm run check:naming
    - name: capability and environment catalog checks
      run: pnpm run check:surfaces
    - name: no emojis (brand rule)
      run: pnpm run check:brand:no-emoji
    - name: tooling package type checks and tests
      run: pnpm run check:tooling