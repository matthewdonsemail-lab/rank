# Git hooks managed by lefthook (https://github.com/evilmartians/lefthook).
# Install after cloning: pnpm exec lefthook install

pre-push:
  jobs:
    - name: hackathon log updated within 30 min
      run: node scripts/check-hackathon-log.mjs
    - name: no monospace fonts (brand rule)
      run: node scripts/check-no-font-mono.mjs
    - name: no tracking-* utilities (brand rule)
      run: node scripts/check-no-tracking.mjs
    - name: machine contracts and documentation
      run: node scripts/check-machine-docs.mjs
    - name: project documentation is current
      run: node scripts/check-project-docs.mjs
    - name: library and domain naming conventions
      run: node scripts/check-naming-conventions.mjs
    - name: CLI, MCP, and HTTP surfaces agree
      run: node scripts/check-surfaces.mjs
    - name: no emojis (brand rule)
      run: node scripts/check-no-emojis.mjs
    - name: package type checks
      run: bun run --cwd packages/rank-core typecheck && bun run --cwd packages/rank-cli typecheck && bun run --cwd packages/rank-mcp typecheck
    - name: package tests
      run: bun test packages/rank-core packages/rank-cli packages/rank-mcp